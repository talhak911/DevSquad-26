    <script>
      // Theme toggling functionality
      const themeToggle = document.getElementById("theme-toggle");
      const themeToggleMobile = document.getElementById("theme-toggle-mobile");
      const htmlElement = document.documentElement;

      function toggleTheme() {
        if (htmlElement.classList.contains("dark")) {
          htmlElement.classList.remove("dark");
          // Could save to localStorage here
        } else {
          htmlElement.classList.add("dark");
        }
      }

      themeToggle.addEventListener("click", toggleTheme);
      themeToggleMobile.addEventListener("click", toggleTheme);

      // Mobile menu functionality
      const mobileMenuBtn = document.getElementById("mobile-menu-btn");
      const mobileMenu = document.getElementById("mobile-menu");

      mobileMenuBtn.addEventListener("click", () => {
        mobileMenu.classList.toggle("open");
      });

      // Active Navigation Link State functionality
      const desktopNavLinks = document.querySelectorAll(".nav-link");
      const mobileNavLinks = document.querySelectorAll(".nav-link-mobile");

      function setActiveLink(links, clickedLink) {
        links.forEach((l) => {
          l.classList.remove(
            "font-bold",
            "underline",
            "decoration-2",
            "underline-offset-8",
          );
          l.classList.add("hover:opacity-70", "transition-opacity");
        });

        clickedLink.classList.remove("hover:opacity-70", "transition-opacity");
        clickedLink.classList.add(
          "font-bold",
          "underline",
          "decoration-2",
          "underline-offset-8",
        );
      }

      desktopNavLinks.forEach((link) => {
        link.addEventListener("click", function (e) {
          setActiveLink(desktopNavLinks, this);
        });
      });

      mobileNavLinks.forEach((link) => {
        link.addEventListener("click", function (e) {
          setActiveLink(mobileNavLinks, this);
          // Optional: Close menu on mobile link click
          mobileMenu.classList.remove("open");
        });
      });
    </script>
