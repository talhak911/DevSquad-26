<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <title>Age calculator app</title>
    <link href="./src/output.css" rel="stylesheet" />
  </head>
  <body
    class="bg-off-white text-off-black font-poppins min-h-screen flex items-center justify-center p-4 md:p-0 selection:bg-purple-primary selection:text-white-bg transition-colors duration-300"
  >
    <!-- Theme Toggle Button -->
    <button
      id="theme-toggle"
      class="absolute top-4 right-4 md:top-8 md:right-8 p-3 rounded-full bg-light-grey hover:bg-smokey-grey/20 transition-colors z-50 text-purple-primary shadow-sm hover:scale-105 active:scale-95 cursor-pointer"
      aria-label="Toggle Theme"
    >
      <svg
        id="theme-icon-moon"
        xmlns="http://www.w3.org/2000/svg"
        class="w-6 h-6 hidden"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"
        />
      </svg>
      <svg
        id="theme-icon-sun"
        xmlns="http://www.w3.org/2000/svg"
        class="w-6 h-6 hidden"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"
        />
      </svg>
    </button>

    <main
      class="bg-white-bg rounded-t-[24px] rounded-bl-[24px] rounded-br-[100px] md:rounded-br-[120px] p-6 pt-12 md:p-14 md:pt-14 max-w-[840px] w-full shadow-sm transition-colors duration-300 mx-auto"
    >
      <form
        id="age-form"
        class="flex flex-col border-b border-light-grey pb-16 md:pb-12 mb-16 md:mb-12 relative transition-colors duration-300"
      >
        <div class="flex gap-4 md:gap-8 w-full md:w-[80%]">
          <!-- Day -->
          <div class="flex flex-col gap-2 w-1/3 max-w-[160px]">
            <label
              for="day"
              id="label-day"
              class="text-[12px] md:text-[14px] font-bold text-smokey-grey tracking-[0.2em] md:tracking-[0.25em] uppercase transition-colors duration-300"
              >Day</label
            >
            <input
              type="number"
              id="day"
              placeholder="DD"
              class="w-full text-[20px] md:text-[32px] font-bold py-3 md:py-4 px-4 border border-light-grey rounded-lg outline-none focus:border-purple-primary transition-colors duration-300 placeholder:text-smokey-grey/50 bg-transparent"
            />
            <span
              id="error-day"
              class="text-[10px] md:text-[14px] text-red-light font-italic mt-1 h-4 hidden"
              >This field is required</span
            >
          </div>

          <!-- Month -->
          <div class="flex flex-col gap-2 w-1/3 max-w-[160px]">
            <label
              for="month"
              id="label-month"
              class="text-[12px] md:text-[14px] font-bold text-smokey-grey tracking-[0.2em] md:tracking-[0.25em] uppercase transition-colors duration-300"
              >Month</label
            >
            <input
              type="number"
              id="month"
              placeholder="MM"
              class="w-full text-[20px] md:text-[32px] font-bold py-3 md:py-4 px-4 border border-light-grey rounded-lg outline-none focus:border-purple-primary transition-colors duration-300 placeholder:text-smokey-grey/50 bg-transparent"
            />
            <span
              id="error-month"
              class="text-[10px] md:text-[14px] text-red-light font-italic mt-1 h-4 hidden"
              >This field is required</span
            >
          </div>

          <!-- Year -->
          <div class="flex flex-col gap-2 w-1/3 max-w-[160px]">
            <label
              for="year"
              id="label-year"
              class="text-[12px] md:text-[14px] font-bold text-smokey-grey tracking-[0.2em] md:tracking-[0.25em] uppercase transition-colors duration-300"
              >Year</label
            >
            <input
              type="number"
              id="year"
              placeholder="YYYY"
              class="w-full text-[20px] md:text-[32px] font-bold py-3 md:py-4 px-4 border border-light-grey rounded-lg outline-none focus:border-purple-primary transition-colors duration-300 placeholder:text-smokey-grey/50 bg-transparent"
            />
            <span
              id="error-year"
              class="text-[10px] md:text-[14px] text-red-light font-italic mt-1 h-4 hidden"
              >This field is required</span
            >
          </div>
        </div>

        <!-- Submit btn -->
        <button
          type="submit"
          class="group absolute -bottom-8 md:-bottom-12 left-1/2 md:left-auto md:right-0 -translate-x-1/2 md:translate-x-0 w-16 h-16 md:w-24 md:h-24 bg-purple-primary hover:bg-submit-hover transition-all duration-300 rounded-full flex items-center justify-center outline-none focus:ring-4 focus:ring-purple-primary/30"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="46"
            height="44"
            viewBox="0 0 46 44"
            class="w-6 md:w-11 h-6 md:h-11 stroke-white transition-colors duration-300"
          >
            <g fill="none" stroke-width="2">
              <path
                d="M1 22.019C8.333 21.686 23 25.616 23 44M23 44V0M45 22.019C37.667 21.686 23 25.616 23 44"
              />
            </g>
          </svg>
        </button>
      </form>

      <!-- Result -->
      <div
        class="flex flex-col gap-0 text-[56px] md:text-[104px] font-extrabold italic leading-[1.1] tracking-tight transition-colors duration-300"
      >
        <div class="flex items-center gap-2">
          <span id="result-years" class="text-purple-primary">--</span>
          <span>years</span>
        </div>
        <div class="flex items-center gap-2">
          <span id="result-months" class="text-purple-primary">--</span>
          <span>months</span>
        </div>
        <div class="flex items-center gap-2">
          <span id="result-days" class="text-purple-primary">--</span>
          <span>days</span>
        </div>
      </div>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
